<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="astronave: a two-voice touch synth in the browser. Two wavefolding voices that bend each other, a pulser, a sequencer, an eight-stage function generator and a patch matrix.">
<meta name="theme-color" content="#02040F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>astronave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: a technical sheet like lamiera — header, five cells side by side (sources, sequencer, synth A, synth B, output), keyboard across the bottom. Landscape screens scale the sheet to fit one screen; phones stack the cells. */
:root{
  --bg:#02040F; --ink:#E5DADA; --dim:#9C9196; --navy:#0E3A5E; --navy-deep:#002642;
  --amber:#E59500; --claret:#840032; --claret-hi:#C23A6A;
  --a:var(--amber); --b:var(--claret-hi); --line:#0E3A5E; --hair:#0E3A5E; --c:var(--amber);
  --font-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font-body:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --row:19px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:14px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.wrap{padding-block:12px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{max-width:1020px;margin:0 auto;border:1px solid var(--navy);transform-origin:0 0}
.tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.mono{font-family:var(--font-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 12px;border-bottom:1px solid var(--navy)}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0;flex:0 0 auto;width:176px}
.subl{overflow:hidden}
.subl{position:relative;height:12px}
.subl>*{position:absolute;left:0;top:0;right:0;line-height:12px}
.subl .toast:not(:empty)+.subt{visibility:hidden}
.brand h1{margin:0;font-family:var(--font-mono);font-weight:400;font-size:14px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.brand .tag{font-size:9px}
.rb{appearance:none;background:none;border:1px solid var(--dim);padding:4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.rb i{width:7px;height:7px;border-radius:50%;background:var(--claret-hi);flex:none}
.rb.on{border-color:var(--amber);color:var(--amber)}
.rb.on i{background:var(--amber)}
.rb:disabled{opacity:.35;cursor:default}
.pwr{border-color:var(--amber);color:var(--amber);animation:pwr 1.6s ease-in-out infinite}
.pwr i{background:var(--amber)}
.pwr.on{animation:none;border-color:var(--navy);color:var(--ink)}
.pwr.on i{background:var(--amber);box-shadow:0 0 6px var(--amber)}
@keyframes pwr{50%{box-shadow:0 0 0 3px rgba(229,149,0,.18)}}
.ib{appearance:none;width:26px;height:26px;border:0;background:none;color:var(--dim);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.ib:not(:disabled):hover{color:var(--ink)}
.ib:disabled{opacity:.3;cursor:default}
.ib.danger{color:var(--claret-hi)}
.ib svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.grp-i{display:flex;align-items:center;gap:0}
.scenebar{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;flex-wrap:wrap}
.spick{display:flex;align-items:center;gap:0;min-width:0;flex:0 0 196px}
.top .ib{width:22px}
.sbtn2{appearance:none;flex:1;min-width:0;height:26px;border:0;border-bottom:1px solid var(--dim);background:none;color:var(--ink);display:flex;align-items:center;gap:8px;padding:0 4px;cursor:pointer;text-align:left}
.sbtn2 .scn{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbtn2 .modf{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.sbtn2 svg{width:8px;height:8px;fill:none;stroke:var(--dim);stroke-width:1.3;flex:none;margin-left:auto}
.nameform{display:flex;align-items:center;gap:6px;flex:0 1 300px;min-width:0}
.nameform input{flex:1;min-width:0;height:24px;border:0;border-bottom:1px solid var(--amber);background:none;color:var(--ink);font:15px var(--font-body);padding:0 4px;outline:none}
.acts{display:flex;align-items:center}
.fams{display:flex;gap:2px 8px;flex-wrap:nowrap}
.fams .chip{font-size:9px;letter-spacing:.03em;gap:5px}
.undo{margin-left:-6px}
.toast{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope{height:26px;margin-top:6px;border-top:1px dashed var(--navy);padding-top:4px}
.scope canvas{width:100%;height:100%;display:block}
.sr{display:none}
#lookBtn{display:none}

/* square ticks (as in lamiera) */
.sc,.chip{appearance:none;background:none;border:0;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border:1px solid var(--dim);flex:none}
.chip:hover,.chip.on{color:var(--ink)}
.chip.on::before{background:var(--c);border-color:var(--c)}
.seg{display:flex;flex-wrap:wrap;gap:2px 10px;min-width:0}

/* cells */
.vc{display:contents}
.cells{display:grid;grid-template-columns:minmax(0,225fr) minmax(0,265fr) minmax(0,265fr) minmax(0,205fr)}
.strip{padding:9px 12px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;border-right:1px solid var(--navy)}
.strip:last-child{border-right:0}
.sh{display:flex;align-items:center;gap:8px;min-height:16px}
.sh h2{margin:0;font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.sh .led2{width:6px;height:6px;border-radius:50%;background:var(--navy);margin-left:auto;flex:none}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;border-top:1px dashed var(--navy);padding-top:5px}
.sub:first-of-type{margin-top:0}
.viz{width:62px;height:16px;display:block;flex:none}
.viz polyline{fill:none;stroke:var(--c);stroke-width:1.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rows{display:flex;flex-direction:column;gap:3px}
.seqbox .rl{grid-template-columns:26px minmax(0,1fr);gap:6px}
.seqbox .seg{gap:2px 5px;flex-wrap:nowrap;justify-content:space-between}
.seqbox .chip{letter-spacing:0;gap:4px}
.rl{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;gap:8px;min-height:var(--row)}
.rl>span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}

/* hairline sliders */
.k{display:grid;grid-template-columns:52px minmax(0,1fr) 46px;align-items:center;gap:8px;min-height:var(--row)}
.kl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{font-family:var(--font-mono);font-size:9.5px;color:var(--c);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vs{position:relative;height:var(--row);cursor:ew-resize;touch-action:none}
.vs::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--dim);opacity:.8}
.vs::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 4px);height:9px;border-left:1px solid var(--dim);border-right:1px solid var(--dim);opacity:.8}
.vs i{position:absolute;top:calc(50% - 7px);height:14px;width:3px;margin-left:-1.5px;left:calc(var(--v,0) * 100%);background:var(--c);z-index:1}
.vs b{display:none}
.k.bi .vs b{display:block;position:absolute;left:50%;top:calc(50% - 3px);height:7px;width:1px;background:var(--dim)}
.k:hover .kl{color:var(--ink)}

/* sequencer */
.seqbox{display:flex;flex-direction:column;gap:5px}
.faders{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;height:104px}
.scol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.led{width:6px;height:6px;border-radius:50%;background:var(--navy)}
.led.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led.off{opacity:.3}
.scol .k{display:flex;flex:1;width:100%;justify-content:center;min-height:0}
.scol .kl,.scol .kv{display:none}
.scol .vs{width:22px;height:auto;flex:none;align-self:stretch;cursor:ns-resize}
.scol .vs::before{left:50%;right:auto;top:0;bottom:0;width:1px;height:auto}
.scol .vs::after{left:calc(50% - 4px);right:auto;width:9px;top:0;bottom:0;height:auto;border:0;border-top:1px solid var(--dim);border-bottom:1px solid var(--dim)}
.scol .vs i{left:calc(50% - 7px);width:14px;height:3px;margin:0 0 -1.5px;top:auto;bottom:calc(var(--v,0) * 100%);opacity:.55}
.scol .k.cur .vs i{opacity:1;box-shadow:0 0 6px var(--amber)}
.scol .k.mute .vs i{background:var(--dim);opacity:.35}
.chip.gate{font-size:9px;gap:4px}

/* second row: random/mod, MARF, patch */
.cells2{display:grid;grid-template-columns:minmax(0,180fr) minmax(0,400fr) minmax(0,440fr);border-top:1px solid var(--navy)}
.cells2>.strip:last-child{border-right:0}
.mtop{display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px}
.mspd{flex:1 1 150px;min-width:140px}
.mspd .k{grid-template-columns:38px minmax(0,1fr) 40px}
.mtop .rl{grid-template-columns:auto minmax(0,1fr)}
.mgrid{display:grid;grid-template-columns:38px repeat(8,minmax(0,1fr));align-items:center;gap:2px 0;margin-top:2px}
.ml{font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#mgraph{grid-column:2/-1;width:100%;height:62px;display:block;cursor:crosshair;touch-action:none;border:1px solid var(--navy);box-sizing:border-box;background:rgba(14,58,94,.12);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
#mgraph polyline{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#mla{stroke:var(--a)} #mlb{stroke:var(--b)}
#mgraph polyline.dim{opacity:.3;stroke-width:1.1}
#msep line{stroke:var(--navy);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
#mskip rect{fill:rgba(2,4,15,.6)}
#mcur{fill:rgba(229,149,0,.0)}
#mcur.live{fill:rgba(229,149,0,.10)}
#mcur.halt{fill:rgba(194,58,106,.14)}
#mout{stroke-width:2;vector-effect:non-scaling-stroke;transition:opacity .3s}
.ft{position:relative;height:16px;margin:0 2px;border-bottom:1px solid var(--navy);font-family:var(--font-mono);font-size:8.5px;color:var(--amber);display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;white-space:nowrap;overflow:hidden}
.ft::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:calc(var(--v,0)*100%);background:var(--amber)}
.fb{appearance:none;justify-self:center;width:9px;height:9px;padding:0;border:1px solid var(--dim);background:none;cursor:pointer;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.fb.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 5px rgba(229,149,0,.5)}
.fb[data-f="x"].on,.fb[data-f="k"].on{background:var(--claret-hi);border-color:var(--claret-hi);box-shadow:0 0 5px rgba(194,58,106,.5)}
.mn{font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;opacity:.6}
.mn.on{color:var(--amber);opacity:1}
.mx{display:grid;grid-template-columns:62px repeat(13,minmax(0,1fr));gap:3px 3px;align-items:center}
.mh{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;padding-bottom:2px}
.mr{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;display:flex;flex-direction:column;gap:3px}
.sbar{display:block;height:2px;width:46px;background:var(--navy);position:relative;overflow:hidden}
.sbar b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber)}
.mc{appearance:none;position:relative;height:18px;border:1px solid var(--navy);background:rgba(2,4,15,.5);padding:0;cursor:ns-resize;touch-action:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.mc::before{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:var(--navy)}
.mc i{position:absolute;top:4px;bottom:4px;left:50%;width:0;background:var(--amber);box-shadow:0 0 5px rgba(229,149,0,.45)}
.mc.neg i{background:var(--claret-hi);box-shadow:0 0 5px rgba(194,58,106,.45)}
.mc.set{border-color:var(--dim)}
.mc.off{border:0;background:none;box-shadow:none;cursor:default}
.mc.off::before{left:calc(50% - 1px);top:calc(50% - 1px);bottom:auto;width:2px;height:2px;background:var(--navy)}

/* output meters */
.tmeter{width:62px;height:2px;background:var(--navy);position:relative;overflow:hidden;flex:none}
.tmeter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber);transition:width .08s}
.meters{display:grid;gap:3px;margin-top:2px}
.meters span{height:2px;background:var(--navy);position:relative;overflow:hidden}
.meters i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber)}
.meters i.hot{background:var(--claret-hi)}

/* keyboard */
.kbd{display:flex;gap:14px;padding:8px 12px;border-top:1px solid var(--navy)}
.kleft{width:300px;flex:none;display:flex;flex-direction:column;gap:4px}
.krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.krow h2{margin:0;font-family:var(--font-mono);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.midi{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.06em;color:var(--dim);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sel{appearance:none;height:24px;border:0;border-bottom:1px solid var(--dim);background:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:space-between;gap:6px;padding:0 3px;cursor:pointer;font-size:13.5px}
.sel svg{width:8px;height:8px;fill:none;stroke:var(--dim);stroke-width:1.3;flex:none}
.sel.wide{flex:1;min-width:0}
.sel.wide span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oct{appearance:none;width:22px;height:22px;border:1px solid var(--dim);background:none;color:var(--ink);font:300 12px/1 var(--font-mono);cursor:pointer;padding:0}
.octl{font-family:var(--font-mono);font-size:10px;min-width:28px;text-align:center}
.karp{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--navy);padding-top:4px}
.keys{flex:1;display:flex;gap:3px;min-height:100px;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none}
.plate{flex:1 1 0;min-width:0;position:relative;border:1px solid var(--dim);background:rgba(229,218,218,.03);cursor:pointer;transition:background .5s}
.plate.sh2{background:rgba(14,58,94,.35);border-color:var(--navy)}
.plate .rt{position:absolute;left:50%;top:8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--amber)}
.plate span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:300 8.5px/1 var(--font-mono);color:var(--dim);white-space:nowrap;overflow:hidden}
.plate.root span{color:var(--amber)}
.plate.on{background:var(--claret);border-color:var(--claret-hi);transition:none}
.plate.on span{color:var(--ink)}
.plate.held{border-color:var(--amber)}

/* popovers */
.pop{position:fixed;z-index:20;width:min(320px,calc(100vw - 32px));max-height:min(72vh,540px);overflow:auto;background:var(--bg);border:1px solid var(--navy);box-shadow:0 18px 48px rgba(0,0,0,.6);padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.poph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.roots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px 6px}
.rbtn,.sbtn{appearance:none;background:none;border:0;padding:4px 0;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--dim);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-align:left}
.rbtn::before,.sbtn::before,.spop .sc::before{content:"";width:7px;height:7px;border:1px solid var(--dim);flex:none}
.rbtn.on,.sbtn.on,.spop .sc.on{color:var(--ink)}
.rbtn.on::before,.sbtn.on::before,.spop .sc.on::before{background:var(--amber);border-color:var(--amber)}
.rbtn:hover,.sbtn:hover,.spop .sc:hover{color:var(--ink)}
.gname{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.75;padding:8px 0 2px;border-top:1px solid var(--navy);margin-top:4px}
.spop .gname:first-child{border-top:0;margin-top:0;padding-top:0}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.sbtn small{font:300 8.5px/1 var(--font-mono);color:var(--dim);margin-left:auto}
.spop .sc{width:100%;font-size:11px;letter-spacing:.03em;text-transform:none;font-family:var(--font-body);padding:5px 0;gap:8px}
.spop .empty{font-size:12px;color:var(--dim);padding:2px 0 4px}
.tabs{display:none}

.phonk-foot{display:flex;justify-content:center;gap:10px;padding:10px 16px 8px;font-size:.78rem;letter-spacing:.04em;color:var(--dim)}
.phonk-foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.phonk-foot a:hover,.phonk-foot a:focus-visible{color:var(--amber);border-bottom-color:currentColor;outline:none}

/* landscape: fixed design width, scaled to fit the screen */
.fit .wrap{overflow:hidden;padding-block:8px 0}
.fit .sheet-box{width:1020px;transform-origin:0 0}
.fit .sheet{max-width:none}
/* very wide screens (phones on their side): voices in two columns, shorter sheet */
.fit.wide .sheet-box{width:1300px}
.wide .cells{grid-template-columns:minmax(0,400fr) minmax(0,420fr) minmax(0,420fr) minmax(0,190fr)}
.wide .strip.v{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-content:start}
.wide .strip.v>.sh{grid-column:1/-1}
.wide .strip.v>.vc{display:flex;flex-direction:column;gap:5px;min-width:0}
.wide .keys{min-height:84px}
.wide .cells2{grid-template-columns:minmax(0,200fr) minmax(0,560fr) minmax(0,520fr)}
.wide #mgraph{height:52px}
.fit.wide .phonk-foot{display:none}
.wide .strip{padding-block:7px 8px;gap:3px}
.wide .sub{margin-top:2px;padding-top:3px}
.wide .faders{height:86px}
.wide .rl{grid-template-columns:40px minmax(0,1fr);gap:6px}
.wide .k{grid-template-columns:44px minmax(0,1fr) 44px;gap:6px}
.wide .seg{gap:2px 7px}
.wide .chip{letter-spacing:.02em}

/* phones in portrait: stacked, compact, keys pinned to the bottom */
@media (max-width:640px) and (orientation:portrait){
  .wrap{padding-block:6px 160px}
  .sheet{border:0}
  .top{padding:6px 0 8px;gap:6px 10px}
  :root{--row:22px}
  .brand{width:auto;flex:1 1 auto}
  .scenebar{flex:1 1 100%;gap:6px 10px}
  .spick{flex:1 1 100%}
  .fams{flex-wrap:wrap}
  .cells{grid-template-columns:minmax(0,1fr)}
  .cells2{grid-template-columns:minmax(0,1fr);border-top:0}
  .cells2>.strip{border-right:0;border-bottom:1px solid var(--navy)}
  .mx{grid-template-columns:52px repeat(13,minmax(0,1fr));gap:3px 2px}
  .mh{font-size:6.5px}
  .fb{width:14px;height:14px}
  .ft{height:26px}
  .strip{border-right:0;border-bottom:1px solid var(--navy);padding:8px 0}
  .faders{height:140px}
  .kbd{flex-direction:column;padding:8px 0;gap:8px}
  .kleft{width:auto}
  .keys{position:fixed;left:0;right:0;bottom:0;z-index:15;min-height:0;height:calc(118px + env(safe-area-inset-bottom,0px));padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--navy);box-sizing:border-box}
  .chip{font-size:10px;padding:5px 0}
}
/* zone surface */
.surf{display:none;flex:1;min-width:0;flex-direction:column;gap:6px}
.sf .surf{display:flex}
.sf .keys,.sf .cells,.sf .cells2,.sf .dgm{display:none}
.sf .kbd{flex-direction:column;gap:8px}
.sf .kleft{width:auto;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 22px}
.sf .kleft .krow{min-width:0}
.sf .kleft>.krow:nth-child(2){width:260px}
.sf .karp{border-top:0;padding-top:0;flex-direction:row;flex-wrap:wrap;gap:6px 18px}
.sftool{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:24px}
.sftool .seg{display:flex;gap:2px 8px}
.zed{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-family:var(--font-mono);font-size:9.5px;color:var(--dim)}
.zed b{font-weight:400;color:var(--ink);letter-spacing:.1em}
.zed[hidden]{display:none}
#sfsvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#sfsvg .z{fill:rgba(229,218,218,.035);stroke:#2f6fd6;stroke-width:5;stroke-linejoin:round;transition:fill .4s}
#sfsvg .z.note{fill:rgba(229,218,218,.06)}
#sfsvg .z.stage{fill:rgba(194,58,106,.12)}
#sfsvg .z.pulse,#sfsvg .z.restart{fill:rgba(229,149,0,.12)}
#sfsvg .z.touch,#sfsvg .z.hold{fill:rgba(14,58,94,.35)}
#sfsvg .z.off{fill:none;stroke:var(--navy)}
#sfsvg .z.root{stroke:var(--amber)}
#sfsvg .z.lit{fill:var(--claret);stroke:var(--claret-hi);transition:none}
#sfsvg .z.held{stroke:var(--amber)}
#sfsvg .z.sel{stroke:var(--ink);stroke-dasharray:14 8}
#sfsvg text{font-family:var(--font-mono);fill:var(--dim);pointer-events:none;text-anchor:middle}
#sfsvg .zl{font-size:22px;fill:#7fa6e6;letter-spacing:.06em}
#sfsvg .zr{font-size:15px}
#sfsvg .zr.root{fill:var(--amber)}
#sfsvg .fing{fill:var(--ink);opacity:.9;pointer-events:none}
.sf.edit #sfsvg .z{cursor:pointer}
/* traces view */
.dgm{display:none;border-top:1px solid var(--navy);position:relative}
.dg .dgm{display:block}
.dg .cells,.dg .cells2{display:none}
.trk{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,330px);border-bottom:1px solid var(--navy)}
.tl{display:contents}
.tl>*{border-top:1px solid rgba(14,58,94,.6);min-width:0}
.tl:first-child>*{border-top:0}
.tlab{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 10px 0 14px}
.tlab b{font:400 9.5px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.tlab span{font:300 8.5px/1 var(--font-mono);color:var(--dim)}
.tcv{display:block;width:100%;height:58px}
.tdst{display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:4px 5px;padding:6px 12px 6px 10px;border-left:1px dashed rgba(14,58,94,.8)}
.tch{appearance:none;position:relative;overflow:hidden;height:22px;padding:0 8px;border:1px solid var(--navy);background:rgba(2,4,15,.6);color:var(--ink);font:400 9.5px/1 var(--font-mono);letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.tch i{position:absolute;left:0;top:0;bottom:0;background:rgba(229,149,0,.22);pointer-events:none}
.tch.neg i{background:rgba(194,58,106,.28)}
.tch em{font-style:normal;color:var(--amber);position:relative}
.tch.neg em{color:var(--claret-hi)}
.tch span{position:relative}
.tch.add{cursor:pointer;color:var(--dim);border-style:dashed;padding:0 7px}
.tch.add:hover{color:var(--amber);border-color:var(--amber)}
.tpop{position:fixed;z-index:25;background:var(--bg);border:1px solid var(--navy);box-shadow:0 18px 48px rgba(0,0,0,.6);padding:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:250px}
.tpop button{appearance:none;background:none;border:1px solid var(--navy);color:var(--ink);font:400 9.5px/1 var(--font-mono);padding:6px 4px;cursor:pointer}
.tpop button:hover{border-color:var(--amber);color:var(--amber)}
.tpop .ttl{grid-column:1/-1;font:400 8.5px/1.3 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:2px 2px 4px}
.dgt svg{display:block;width:100%;height:auto;touch-action:none}
@media (max-width:640px){
  .trk{grid-template-columns:78px minmax(0,1fr)}
  .tdst{grid-column:1/-1;border-left:0;padding:2px 10px 8px;border-top:0!important}
  .tlab{padding-left:4px}
}
.vsw{display:flex;gap:0;margin-right:14px}
.dicegrp{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;white-space:nowrap;flex:none}
.dicegrp .fams{flex-wrap:nowrap!important}
.vsw .rb{border-radius:0}
.dgt{border-top:1px solid var(--navy)}
.dgt rect.sg{fill:rgba(2,4,15,.4);stroke:var(--navy);stroke-width:1}
.dgt rect.sg.on{fill:rgba(229,149,0,.1)}
.dgt .la,.dgt .lb{fill:none;stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dgt .la{stroke:var(--a)}.dgt .lb{stroke:var(--b)}
.dgt .dim{opacity:.35;stroke-width:1.2}
.dgt text{font-family:var(--font-mono);font-size:8.5px;fill:var(--dim)}
.dgt .tc{cursor:crosshair}

/* ============ skin: after nebbia — quiet light type, no boxes, hairlines and dots, rings in the dark ============ */
:root{
  --dim:#968E96; --navy:#152139; --line:#152139; --line2:#27344f; --claret-hi:#D2577F; --wine:#D2577F; --night:#4A8CC4;
  --font-body:"Helvetica Neue","IBM Plex Sans",Helvetica,Arial,sans-serif; --font-mono:var(--font-body);
  --row:20px;
}
body{font-weight:400;font-variant-numeric:tabular-nums}
.wrap,.pop,.tpop{text-transform:lowercase}
.wrap *,.pop *,.tpop *{letter-spacing:0!important;text-transform:inherit!important}
.scn,.nameform input,.spop .sc,#sceneList *{text-transform:none!important}
.wrap{position:relative;z-index:1}
.sheet{border:0;background:none;box-shadow:none}

/* header */
.top{border-bottom:0;background:none;padding:10px 12px 14px;gap:8px 14px}
.brand{gap:1px;width:186px}
.brand h1{font-family:var(--font-body);font-weight:300;font-size:24px;letter-spacing:-.01em!important;line-height:1.15}
.subl{height:15px}.subl>*{line-height:15px}
.tag,.brand .tag{font-size:11.5px;color:var(--dim)}
.toast{font-size:11.5px}
.rb{border:0;background:none;box-shadow:none;padding:4px 2px;font-size:13px;font-weight:400;color:var(--dim);gap:7px}
.rb:hover{color:var(--ink)}
.rb:active{box-shadow:none}
.rb i{width:6px;height:6px;background:var(--line2)}
.rb.on{color:var(--ink)}
.pwr{color:var(--amber);animation:none;padding:4px 4px}
.pwr i{background:none;border:1px solid var(--amber);width:9px;height:9px;box-sizing:border-box;animation:pwr 1.8s ease-in-out infinite}
.pwr.on{color:var(--dim)}
.pwr.on i{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px var(--amber);animation:none}
@keyframes pwr{50%{box-shadow:0 0 0 5px rgba(229,149,0,.16)}}
.vsw{gap:14px;margin-right:18px}
.vsw .rb{padding:4px 0 3px;border-bottom:1px solid transparent}
.vsw .rb.on{color:var(--ink);border-bottom-color:var(--amber)}
#dice{color:var(--ink)}
#dice i{background:var(--amber)!important}
.sbtn2{border-bottom-color:var(--line2)}
.sbtn2 .scn{font-size:17px;font-weight:300}
.sbtn2 .modf{font-size:10.5px}
.nameform input{font-weight:300;font-size:17px}
.ib svg{stroke-width:1.1}
.fams .chip{font-size:12px}
.scope{border-top:0}

/* text toggles: a small ring that fills */
.sc,.chip{font-size:11.5px;gap:6px;color:var(--dim)}
.chip::before,.rbtn::before,.sbtn::before,.spop .sc::before{width:6px;height:6px;border-radius:50%;border:1px solid var(--line2);box-shadow:none;box-sizing:border-box}
.chip.on::before{box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent)}
.chip.gate{font-size:10.5px}

/* cells: no boxes, air instead of rules */
.cells,.cells2,.kbd,.dgm{border-top:1px solid var(--line)}
.strip,.kbd{background:none;box-shadow:none}
.strip{border-right:0;padding:12px 14px 12px;gap:5px}
.sh{min-height:20px}
.sh h2,.krow h2{font-family:var(--font-body);font-weight:300;font-size:16px;color:var(--ink)}
.sh .led2{background:var(--line2)}
.sub{border-top:0;margin-top:7px;padding-top:0}
.viz{filter:none;opacity:.9}
.rl>span,.kl,.ml,.mr{font-size:11px;color:var(--dim)}
.kv{font-size:11px}
.k{grid-template-columns:54px minmax(0,1fr) 46px}

/* hairline with a dot */
.vs::before{background:var(--line2);opacity:1;box-shadow:none}
.vs::after{top:50%;height:1px;border:0;right:auto;width:calc(var(--v,0) * 100%);background:var(--c);opacity:.55}
.k.bi .vs::after{left:calc(var(--b0,.5) * 100%);width:calc(var(--b1,0) * 100%)}
.vs i{top:calc(50% - 3.5px);height:8px;width:8px;margin-left:-4px;border-radius:50%;box-shadow:none;background-image:none}
.k.bi .vs b{background:var(--line2);top:calc(50% - 4px);height:9px}
.k:hover .vs i{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.scol .vs::before{background:var(--line2)}
.scol .vs::after{left:50%;width:1px;top:auto;bottom:0;height:calc(var(--v,0) * 100%);border:0;background:var(--c);opacity:.5}
.scol .vs i{left:calc(50% - 4px);width:8px;height:8px;margin:0 0 -4px;border-radius:50%;opacity:.6}
.led{background:var(--line2);width:5px;height:5px}

/* marf and matrix */
#mgraph{border:0;background:none;box-shadow:none;border-bottom:1px solid var(--line)}
#msep line{stroke:var(--line)}
.ft{border-bottom-color:var(--line2);font-size:10.5px;height:17px}
.fb{width:8px;height:8px;border-radius:50%;border-color:var(--line2);box-shadow:none}
.fb.on{box-shadow:0 0 6px rgba(229,149,0,.5)}
.mn{font-size:10px}
.mh{font-size:8.5px;overflow:visible}
.mx{grid-template-columns:50px repeat(13,minmax(0,1fr));gap:3px 2px}
.mc{border:0;background:none;box-shadow:none;height:19px}
.mc::before{left:calc(50% - 1px);top:calc(50% - 1px);bottom:auto;width:2px;height:2px;border-radius:50%;background:var(--line2)}
.mc i{top:calc(50% - 1.5px);bottom:auto;height:3px;border-radius:2px;box-shadow:none}
.mc.set{border:0}
.mc.set::before{background:var(--dim)}
.mc:hover::before{background:var(--amber)}
.mc.off::before{background:var(--line)}
.sbar{background:var(--line);height:1px}
.sbar b{height:1px}
.tmeter,.meters span{background:var(--line);box-shadow:none;height:1px}
.meters{gap:5px}

/* keyboard: slim capsules */
.kbd{padding:12px 14px}
.midi{font-size:10.5px}
.sel{border-bottom-color:var(--line2);font-size:15px;font-weight:300}
.oct{border:0;background:none;box-shadow:none;color:var(--dim);font:300 17px/1 var(--font-body)}
.oct:hover{color:var(--amber)}
.oct:active{box-shadow:none}
.octl{font-size:12px;color:var(--ink)}
.karp{border-top:0;padding-top:6px}
.keys{gap:5px}
.plate{border:1px solid var(--line2);border-radius:999px;background:none;background-image:none;box-shadow:none;transition:background .6s,border-color .6s}
.plate.sh2{background:rgba(74,140,196,.07);background-image:none;border-color:var(--line)}
.plate .rt{top:12px;width:5px;height:5px}
.plate span{bottom:11px;font:300 10px/1 var(--font-body)}
.plate.on{transform:none;background:rgba(210,87,127,.55);background-image:none;border-color:var(--wine);box-shadow:0 0 18px rgba(210,87,127,.25);transition:none}
.plate.held{border-color:var(--amber)}

/* popovers */
.pop,.tpop{border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.8);background:#04071a}
.gname{font-size:11px;border-top-color:var(--line)}
.rbtn,.sbtn{font-size:12px}
.sbtn small{font:300 10.5px/1 var(--font-body)}
.tpop button{border:0;border-radius:999px;font-size:12px;color:var(--dim)}
.tpop button:hover{color:var(--amber)}
.tpop .ttl{font-size:11px}
.phonk-foot{font-size:.8rem}

/* traces */
.trk{border-bottom:1px solid var(--line)}
.tl>*{border-top:0}
.tlab b{font:300 14px/1.1 var(--font-body);color:var(--ink)}
.tlab span{font:400 10.5px/1.1 var(--font-body)}
.tdst{border-left:0}
.tch{border:1px solid var(--line2);border-radius:999px;background:none;font:400 11.5px/1 var(--font-body);height:23px;padding:0 10px}
.tch i{background:rgba(229,149,0,.16)}
.tch.neg i{background:rgba(210,87,127,.2)}
.tch.add{border-style:solid;border-color:var(--line);font-size:14px}
.dgt{border-top:0}
.dgt rect.sg{fill:none;stroke:var(--line)}
.dgt rect.sg.on{fill:rgba(229,149,0,.07)}
.dgt text{font-size:10px}

/* surface */
#sfsvg .z{stroke:var(--night);stroke-width:2.5;fill:rgba(74,140,196,.04)}
#sfsvg .z.note{fill:rgba(229,218,218,.03)}
#sfsvg .z.stage{fill:rgba(210,87,127,.09)}
#sfsvg .z.pulse,#sfsvg .z.restart{fill:rgba(229,149,0,.09)}
#sfsvg .z.touch,#sfsvg .z.hold{fill:rgba(74,140,196,.1)}
#sfsvg .z.off{stroke:var(--line)}
#sfsvg .zl{fill:var(--night);font-size:21px;font-weight:300}
#sfsvg .zr{font-size:16px}
.zed{font-size:11.5px}

.tag[style]{font-size:11px!important}
.rb[style]{font-size:11.5px!important;padding:2px 4px!important}
.wide .strip{padding-block:8px 8px}
@media (max-width:640px) and (orientation:portrait){
  .top{padding:6px 0 10px}
  .strip{border-bottom:0;padding:10px 0}
  .cells2>.strip{border-bottom:0}
  .mh{font-size:8px}
  .mx{grid-template-columns:44px repeat(13,minmax(0,1fr))}
  .kbd{padding:10px 0}
  .keys{background:var(--bg);border-top:1px solid var(--line)}
  .chip{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap"><div class="sheet-box"><div class="sheet">
  <header class="top">
    <div class="brand"><h1>astronave</h1><div class="subl"><span class="toast" id="toast" role="status"></span><span class="tag subt">two voices, eight stages, no map</span></div></div>
    <button class="rb pwr" id="power" aria-pressed="false" aria-label="Start the sound"><i></i><b id="powerTxt" style="font-weight:400">Start</b></button>
    <div class="scenebar">
      <div class="spick" id="spick">
        <button class="ib" id="scPrev" aria-label="Previous scene" title="Previous scene"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="sbtn2" id="scBtn" aria-haspopup="listbox" aria-expanded="false"><span class="scn" id="scnName">Blab</span><span class="modf" id="scnMod" hidden>edited</span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
        <button class="ib" id="scNext" aria-label="Next scene" title="Next scene"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
      <div class="nameform" id="nameForm" hidden>
        <input id="nameIn" maxlength="40" aria-label="Scene name" autocomplete="off">
        <button class="rb on" id="nameOk">Save</button>
        <button class="rb" id="nameNo">Cancel</button>
      </div>
      <div class="acts">
        <button class="ib" id="actNew" aria-label="Save as a new scene" title="Save as new"><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg></button>
        <button class="ib" id="actRen" aria-label="Rename the scene" title="Rename"><svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg></button>
        <button class="ib" id="actOver" aria-label="Overwrite the scene" title="Overwrite"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/></svg></button>
        <button class="ib" id="actDel" aria-label="Delete the scene" title="Delete"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"/></svg></button>
        <button class="ib" id="actExp" aria-label="Export your scenes" title="Export"><svg viewBox="0 0 16 16"><path d="M8 10V2M5 5l3-3 3 3M3 9v4h10V9"/></svg></button>
        <button class="ib" id="actImp" aria-label="Import scenes" title="Import"><svg viewBox="0 0 16 16"><path d="M8 2v8M5 7l3 3 3-3M3 9v4h10V9"/></svg></button>
        <input type="file" id="impFile" accept=".json,application/json" hidden>
      </div>
      <div class="grp-i undo">
      <button class="ib" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3"/><path d="M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
      <button class="ib" id="redo" aria-label="Redo" title="Redo"><svg viewBox="0 0 16 16"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
    </div>
      <div class="vsw" role="group" aria-label="View"><button class="rb on" id="vwP" aria-pressed="true">Panel</button><button class="rb" id="vwD" aria-pressed="false">Traces</button><button class="rb" id="vwS" aria-pressed="false">Surface</button></div>
      <div class="dicegrp"><button class="rb" id="dice" title="Random scene"><i style="background:var(--amber)"></i>Dice</button>
      <div class="fams" id="fams" role="radiogroup" aria-label="Kind of random scene"></div></div>
    </div>
    <span class="sr" id="srInfo"></span>
    <button class="ib" id="lookBtn" aria-hidden="true" tabindex="-1"></button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Modules"></nav>
  <main class="cells" id="strips"></main>
  <section class="cells2" id="mods"></section>
  <section class="dgm" id="dgm"><div class="trk" id="trk" role="group" aria-label="Modulation sources, live, with where each one goes"></div><div class="dgt"><svg id="dgt" viewBox="0 0 1000 100" aria-label="MARF stages as a timeline: width is time, draw to set levels"></svg></div></section>

  <section class="kbd">
    <div class="kleft">
      <div class="krow"><h2>Keyboard</h2><span class="midi" id="midiStatus">MIDI · waiting</span></div>
      <div class="krow">
        <button class="sel" id="rootBtn" aria-haspopup="dialog" style="width:52px"><span id="rootLbl">C</span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
        <button class="sel wide" id="scaleBtn" aria-haspopup="dialog"><span id="scaleLbl">Minor pentatonic</span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
      </div>
      <div class="krow">
        <button class="chip" id="onlyBtn" aria-pressed="false">Scale only</button>
        <span style="margin-left:auto"></span>
        <button class="oct" id="octDn" aria-label="Octave down">−</button>
        <span class="octl" id="octLbl">C3</span>
        <button class="oct" id="octUp" aria-label="Octave up">+</button>
      </div>
      <div class="karp">
        <div class="krow"><button class="chip" data-id="arpOn" data-tog="1" aria-pressed="false">Arpeggio</button><button class="chip" data-id="latch" data-tog="1" aria-pressed="false">Hold</button></div>
        <div class="seg" data-id="arpMode" role="group" aria-label="Arpeggio order"><button class="chip" data-i="0">Up</button><button class="chip" data-i="1">Down</button><button class="chip" data-i="2">Up-down</button><button class="chip" data-i="3">Random</button><button class="chip" data-i="4">Played</button></div>

const SF_LAYOUTS = (() => {

  const pair = { A: 'K', B: 'J', C: 'I', D: 'H', L: 'Y', M: 'X', N: 'W', O: 'V', P: 'U', Q: 'T', R: 'S' };
  const z = [];

let sfLayout = '222e', sfMaps = {}, sfEdit = false, sfSelZ = null;

const sfCfg = id => (sfMaps[sfLayout] && sfMaps[sfLayout][id]) || SF_LAYOUTS[sfLayout].def[id] || { role: 'off', v: 0 };
function sfNote(deg) { const iv = SCALES[state.scale].iv, n = iv.length, o = Math.floor(deg / n), d = ((deg % n) + n) % n; return 12 * (oct + 1) + state.root + iv[d] + 12 * o; }
function sfText(c) {

const sfSvg = document.getElementById('sfsvg');

function sfEditor() {
  const ed = document.getElementById('zed');
  if (!sfEdit) { ed.hidden = true; return; }
  ed.hidden = false;
  if (!sfSelZ) { ed.innerHTML = '<span>Tap a zone to set what it does</span>'; return; }
  const c = sfCfg(sfSelZ), hasV = c.role === 'note' || c.role === 'stage';
  ed.innerHTML = `<b>${sfLayout === '222e' ? sfSelZ : 'Zone'}</b><div class="seg" role="group" aria-label="What this zone does">${SF_ROLES.map(([r, n]) => `<button class="chip${c.role === r ? ' on' : ''}" data-r="${r}" aria-pressed="${c.role === r}">${n}</button>`).join('')}</div>` +
    (hasV ? `<button class="oct" id="zvDn" aria-label="Lower">−</button><span class="octl">${c.role === 'note' ? sfText(c) + ' · ' + (c.v >= 0 ? '+' : '') + c.v : c.v + 1}</span><button class="oct" id="zvUp" aria-label="Higher">+</button>` : '');

/* ---------------- one screen in landscape: the sheet is scaled to fit ---------------- */
const boxEl = document.querySelector('.sheet-box'), wrapEl = document.querySelector('.wrap');
